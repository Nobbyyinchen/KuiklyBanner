<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KuiklyBanner demo video generator</title>
  <style>
    html, body { margin: 0; background: #eef2f8; font-family: Arial, sans-serif; }
    canvas { display: block; width: 720px; height: 405px; }
  </style>
</head>
<body>
<canvas id="demo" width="720" height="405"></canvas>
<script>
const canvas = document.querySelector("#demo");
const ctx = canvas.getContext("2d");
const demo = new URLSearchParams(location.search).get("demo") || "peek";
const names = {
  peek: "PeekBannerV2",
  double: "DoubleBanner",
  vertical: "VerticalBanner",
};
const colors = ["#5B8FF9", "#61DDAA", "#65789B"];
const paleColors = ["#D6E4FF", "#D9F7BE", "#E6F7FF"];
const labels = ["One", "Two", "Three"];

function roundedRect(x, y, width, height, radius, fill) {
  ctx.beginPath();
  ctx.roundRect(x, y, width, height, radius);
  ctx.fillStyle = fill;
  ctx.fill();
}

function text(value, x, y, size, color, align = "left", weight = 400) {
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px Arial, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillText(value, x, y);
}

function ease(progress) {
  return progress < 0.5
    ? 4 * progress * progress * progress
    : 1 - Math.pow(-2 * progress + 2, 3) / 2;
}

function phaseAt(seconds) {
  const phase = seconds / 2;
  const from = Math.floor(phase) % labels.length;
  const progress = ease(phase - Math.floor(phase));
  return { from, progress };
}

function baseFrame(title) {
  ctx.fillStyle = "#F5F7FB";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  text(title, 44, 46, 28, "#17233D", "left", 700);
  text("Kuikly DSL reusable banner", 44, 78, 15, "#718096");
  roundedRect(44, 352, 116, 28, 14, "#EEF3FF");
  roundedRect(170, 352, 74, 28, 14, "#EEF9F4");
  roundedRect(254, 352, 112, 28, 14, "#F3F0FF");
  text("Android", 102, 366, 13, "#3C64B1", "center", 700);
  text("iOS", 207, 366, 13, "#258866", "center", 700);
  text("HarmonyOS", 310, 366, 13, "#6B55B6", "center", 700);
  text("Sample animation · no business assets", 676, 366, 12, "#9AA5B5", "right");
}

function drawPeek(seconds) {
  baseFrame(names.peek);
  const { from, progress } = phaseAt(seconds);
  const viewportX = 44;
  const viewportY = 112;
  const viewportWidth = 632;
  const cardWidth = 524;
  const gap = 18;
  ctx.save();
  ctx.beginPath();
  ctx.rect(viewportX, viewportY, viewportWidth, 190);
  ctx.clip();
  for (let offset = -1; offset <= 2; offset += 1) {
    const logical = (from + offset + labels.length) % labels.length;
    const x = viewportX + offset * (cardWidth + gap) - progress * (cardWidth + gap);
    roundedRect(x, viewportY, cardWidth, 190, 20, colors[logical]);
    text(labels[logical], x + 32, viewportY + 54, 24, "#FFFFFF", "left", 700);
    text("Peek the next card", x + 32, viewportY + 90, 16, "rgba(255,255,255,.86)");
  }
  ctx.restore();
  text("Horizontal paging · adjacent card preview · autoplay", 44, 326, 15, "#4A5568");
}

function drawDouble(seconds) {
  baseFrame(names.double);
  const { from, progress } = phaseAt(seconds);
  const viewportX = 44;
  const viewportWidth = 632;
  const cardWidth = 540;
  const gap = 16;
  ctx.save();
  ctx.beginPath();
  ctx.rect(viewportX, 106, viewportWidth, 214);
  ctx.clip();
  for (let offset = -1; offset <= 2; offset += 1) {
    const logical = (from + offset + labels.length) % labels.length;
    const mainX = viewportX + offset * (cardWidth + gap) - progress * (cardWidth + gap);
    const subX = viewportX + offset * viewportWidth - progress * viewportWidth;
    roundedRect(mainX, 106, cardWidth, 142, 18, colors[logical]);
    text(`Main ${labels[logical]}`, mainX + 28, 151, 23, "#FFFFFF", "left", 700);
    text("Two areas move in sync", mainX + 28, 187, 16, "rgba(255,255,255,.86)");
    roundedRect(subX, 232, viewportWidth, 78, 14, paleColors[logical]);
    text(`Sub ${labels[logical]}`, subX + viewportWidth / 2, 271, 18, "#263238", "center", 700);
  }
  ctx.restore();
  text("Main/sub synchronization · different page widths · autoplay", 44, 334, 15, "#4A5568");
}

function drawVertical(seconds) {
  baseFrame(names.vertical);
  const { from, progress } = phaseAt(seconds);
  const centerX = 360;
  const baseY = 230;
  const cardWidth = 606;
  const cardHeight = 122;
  const spacing = 34;
  for (let offset = 2; offset >= 0; offset -= 1) {
    const currentOffset = offset - progress;
    const logical = (from + offset) % labels.length;
    const nextLogical = (logical + 1) % labels.length;
    let shownOffset = currentOffset;
    let shownLogical = logical;
    if (shownOffset < -0.5) {
      shownOffset += labels.length;
      shownLogical = nextLogical;
    }
    const scale = Math.max(0.8, 1 - Math.max(0, shownOffset) * 0.1);
    const width = cardWidth * scale;
    const height = cardHeight * scale;
    const x = centerX - width / 2;
    const y = baseY - shownOffset * spacing - height;
    ctx.globalAlpha = Math.max(0.55, 1 - Math.max(0, shownOffset) * 0.2);
    roundedRect(x, y, width, height, 18, colors[shownLogical]);
    text(labels[shownLogical], centerX, y + height / 2, 24 * scale, "#FFFFFF", "center", 700);
  }
  ctx.globalAlpha = 1;
  text("Vertical swipe · three-card stack · loop autoplay", 44, 326, 15, "#4A5568");
}

function drawFrame(seconds) {
  if (demo === "double") drawDouble(seconds);
  else if (demo === "vertical") drawVertical(seconds);
  else drawPeek(seconds);
}

async function record() {
  const output = [
    { mimeType: "video/mp4;codecs=avc1.42E01E", extension: "mp4" },
    { mimeType: "video/mp4", extension: "mp4" },
    { mimeType: "video/webm;codecs=vp9", extension: "webm" },
    { mimeType: "video/webm;codecs=vp8", extension: "webm" },
    { mimeType: "video/webm", extension: "webm" },
  ].find(candidate => MediaRecorder.isTypeSupported(candidate.mimeType));
  if (!output) throw new Error("MP4/WebM recording is not supported by this browser");

  const chunks = [];
  const recorder = new MediaRecorder(canvas.captureStream(30), {
    mimeType: output.mimeType,
    videoBitsPerSecond: 1_600_000,
  });
  recorder.ondataavailable = event => {
    if (event.data.size) chunks.push(event.data);
  };
  const startedAt = performance.now();
  let animationFrame;
  function animate(now) {
    drawFrame((now - startedAt) / 1000);
    animationFrame = requestAnimationFrame(animate);
  }
  recorder.start(250);
  animationFrame = requestAnimationFrame(animate);
  await new Promise(resolve => setTimeout(resolve, 6_200));
  cancelAnimationFrame(animationFrame);
  drawFrame(6.2);
  const stopped = new Promise(resolve => recorder.addEventListener("stop", resolve, { once: true }));
  recorder.stop();
  await stopped;

  const blob = new Blob(chunks, { type: output.mimeType });
  const anchor = document.createElement("a");
  anchor.href = URL.createObjectURL(blob);
  anchor.download = `${demo}-banner.${output.extension}`;
  anchor.click();
}

drawFrame(0);
record().catch(error => {
  document.title = `ERROR: ${error.message}`;
  console.error(error);
});
</script>
</body>
</html>
